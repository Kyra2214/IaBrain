name: Quality Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  architecture:
    name: Architecture review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate architecture rules
        run: python3 scripts/validate_architecture.py

  android:
    name: Android tests and validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Validate catalogs
        run: python3 scripts/validate_catalog.py
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Lint
        run: ./gradlew lint --stacktrace
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

  javascript-quality:
    name: JS/TS Biome + Stryker (when applicable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect JS/TS project
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Setup Node
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.enabled == 'true'
        run: npm ci
      - name: Biome
        if: steps.detect.outputs.enabled == 'true'
        run: npx --no-install biome ci .
      - name: Stryker mutation testing
        if: steps.detect.outputs.enabled == 'true' && hashFiles('stryker.config.*') != ''
        run: npx --no-install stryker run
      - name: Explain skipped JS/TS gates
        if: steps.detect.outputs.enabled != 'true'
        run: echo 'No package.json detected; Biome/Stryker are not applicable to this Kotlin-only repository.'

  security:
    name: Security policy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan for obvious secret material
        shell: bash
        run: |
          if git grep -n -E '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,})' -- ':!docs/**'; then
            echo 'Potential credential material detected. Remove it before merge.'
            exit 1
          fi
      - name: Ensure E2E workflow was not modified by this gate
        run: git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- .github/workflows/android-e2e.yml | grep -q . && { echo 'android-e2e.yml must not be modified'; exit 1; } || true

  gate:
    name: Quality Gate / all required checks
    if: always()
    needs: [architecture, android, javascript-quality, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to pass
        shell: bash
        run: |
          test "${{ needs.architecture.result }}" = success
          test "${{ needs.android.result }}" = success
          test "${{ needs.javascript-quality.result }}" = success
          test "${{ needs.security.result }}" = success
          echo 'QUALITY GATE PASSED'
