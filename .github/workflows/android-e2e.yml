name: Android E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Android Test Compilation
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Upload build and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/apk/debug/*.apk

  e2e:
    name: Instrumented E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and emulator
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator"

      # connectedDebugAndroidTest executes every class in app/src/androidTest,
      # including AIBrainFullFlowE2ETest, GlobalNavigationE2ETest,
      # MainActivitySmokeTest, and the local Room/routing coverage in
      # AppDatabaseTest.
      - name: Run both instrumentation E2E suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/emulator
          adb devices -l > artifacts/emulator/adb-devices.txt 2>&1
          adb shell getprop > artifacts/emulator/getprop.txt 2>&1
          adb logcat -d > artifacts/emulator/logcat.txt 2>&1
          adb exec-out screencap -p > artifacts/emulator/screenshot.png 2> artifacts/emulator/screenshot-error.txt
          printf 'diagnostic_collection_exit_code=%s\n' "$?" > artifacts/emulator/collection-status.txt
          exit 0

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/emulator/**
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
            **/build/test-results/**
