name: Android E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Android Test Compilation
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Upload build and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/apk/debug/*.apk

  fullflow:
    name: E2E - AIBrainFullFlowE2ETest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and emulator
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # FullFlow is intentionally isolated. Later suites depend on this job.
      - name: Run AIBrainFullFlowE2ETest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb wait-for-device
            ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.aibrain.app.AIBrainFullFlowE2ETest

      - name: Collect FullFlow emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/emulator-fullflow
          run_diag() {
            local name="$1"
            shift
            timeout 20s "$@" > "artifacts/emulator-fullflow/${name}.txt" 2> "artifacts/emulator-fullflow/${name}.stderr.txt"
            printf '%s\n' "$?" > "artifacts/emulator-fullflow/${name}.exit-code"
          }
          run_diag adb-devices adb devices -l
          run_diag getprop adb shell getprop
          run_diag logcat adb logcat -d
          timeout 20s adb exec-out screencap -p > artifacts/emulator-fullflow/screenshot.png 2> artifacts/emulator-fullflow/screenshot-error.txt
          printf '%s\n' "$?" > artifacts/emulator-fullflow/screenshot.exit-code
          printf 'diagnostics_completed_at=%s\n' "$(date -u +%FT%TZ)" > artifacts/emulator-fullflow/collection-status.txt

      - name: Upload FullFlow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-fullflow-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/emulator-fullflow/**
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
            **/build/test-results/**

  navigation:
    name: E2E - GlobalNavigationE2ETest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: fullflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and emulator
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run GlobalNavigationE2ETest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb wait-for-device
            ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.aibrain.app.GlobalNavigationE2ETest

      - name: Collect navigation emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/emulator-navigation
          run_diag() {
            local name="$1"
            shift
            timeout 20s "$@" > "artifacts/emulator-navigation/${name}.txt" 2> "artifacts/emulator-navigation/${name}.stderr.txt"
            printf '%s\n' "$?" > "artifacts/emulator-navigation/${name}.exit-code"
          }
          run_diag adb-devices adb devices -l
          run_diag getprop adb shell getprop
          run_diag logcat adb logcat -d
          timeout 20s adb exec-out screencap -p > artifacts/emulator-navigation/screenshot.png 2> artifacts/emulator-navigation/screenshot-error.txt
          printf '%s\n' "$?" > artifacts/emulator-navigation/screenshot.exit-code
          printf 'diagnostics_completed_at=%s\n' "$(date -u +%FT%TZ)" > artifacts/emulator-navigation/collection-status.txt

      - name: Upload navigation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-navigation-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/emulator-navigation/**
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
            **/build/test-results/**

  smoke-database:
    name: E2E - Smoke and Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: fullflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and emulator
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner argument accepts a comma-separated class list.
      - name: Run smoke and database tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb wait-for-device
            ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.aibrain.app.MainActivitySmokeTest,com.aibrain.app.data.local.AppDatabaseTest

      - name: Collect smoke/database emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/emulator-smoke-database
          run_diag() {
            local name="$1"
            shift
            timeout 20s "$@" > "artifacts/emulator-smoke-database/${name}.txt" 2> "artifacts/emulator-smoke-database/${name}.stderr.txt"
            printf '%s\n' "$?" > "artifacts/emulator-smoke-database/${name}.exit-code"
          }
          run_diag adb-devices adb devices -l
          run_diag getprop adb shell getprop
          run_diag logcat adb logcat -d
          timeout 20s adb exec-out screencap -p > artifacts/emulator-smoke-database/screenshot.png 2> artifacts/emulator-smoke-database/screenshot-error.txt
          printf '%s\n' "$?" > artifacts/emulator-smoke-database/screenshot.exit-code
          printf 'diagnostics_completed_at=%s\n' "$(date -u +%FT%TZ)" > artifacts/emulator-smoke-database/collection-status.txt

      - name: Upload smoke/database diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-smoke-database-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/emulator-smoke-database/**
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
            **/build/test-results/**
